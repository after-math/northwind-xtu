{% extends 'base.html' %}{% block title %}操作提示{% endblock %}{% block content %}<section class="panel error-panel"><div class="eyebrow">{{ code }}</div><h1>{{ '暂时无法连接' if code==503 else '操作提示' }}</h1><p>{{ message }}</p><a class="btn btn-primary" href="{{ url_for('dashboard.index') if session.get('user_id') else url_for('auth.login') }}">返回{{ '工作台' if session.get('user_id') else '登录页' }}</a><button class="btn btn-light go-back" type="button">返回上一页</button></section>{% endblock %}
