# Replace server_name with the actual domain. Configure TLS with your certificate
# before enabling SESSION_COOKIE_SECURE=true for external use.
server {
    listen 80;
    server_name northwind.example.com;
    client_max_body_size 128k;
    location /static/ {
        alias /opt/northwind-management/app/static/;
        expires 7d;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 45s;
    }
}
