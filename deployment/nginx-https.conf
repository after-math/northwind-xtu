# Replace domain and certificate paths before enabling this configuration.
server {
    listen 80;
    server_name northwind.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name northwind.example.com;
    ssl_certificate /etc/nginx/certs/northwind/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/northwind/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128k;
    location /static/ {
        alias /opt/northwind-management/app/static/;
        expires 7d;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 45s;
    }
}
