services:
  - type: web
    name: northwind-xtu
    runtime: python
    plan: free
    region: singapore
    autoDeployTrigger: off
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60 --access-logfile - --error-logfile -
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        value: northwind
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
